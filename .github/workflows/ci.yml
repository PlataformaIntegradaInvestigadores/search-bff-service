name: CI — search_microservice_backend

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    uses: PlataformaIntegradaInvestigadores/.github/.github/workflows/branch-name.yml@main

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-cov
      - name: Ejecutar tests
        run: |
          pytest tests/ -v --tb=short \
            --junitxml=report.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            report.xml
            coverage.xml

  # ── Docker build ───────────────────────────────────────────────────────────
  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Build imagen
        run: docker build -t search_microservice_backend:${{ github.sha }} .
      - name: Verificar imagen
        run: docker images search_microservice_backend

  # ── Deploy staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: test
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/search_microservice_backend
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build search-bff-service

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8004/api-se/v2/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/search_microservice_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build search-bff-service
            exit 1
          fi
