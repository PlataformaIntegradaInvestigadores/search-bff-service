name: CI — search_microservice_backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-cov
      - name: Ejecutar tests
        run: |
          pytest tests/ -v --tb=short \
            --junitxml=report.xml \
            --cov=app --cov-report=term --cov-report=xml:coverage.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            report.xml
            coverage.xml

  # ── Deploy staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/search_microservice_backend
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build search-microservice-backend

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8004/api-se/v2/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/search_microservice_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build search-microservice-backend
            exit 1
          fi

  # ── Deploy producción ───────────────────────────────────────────────────────
  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/search_microservice_backend
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela
          docker compose up -d --build search-microservice-backend

      - name: Health check con rollback automático
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8004/api-se/v2/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/search_microservice_backend && git reset --hard HEAD~1
            cd /opt/centinela && docker compose up -d --build search-microservice-backend
            exit 1
          fi
